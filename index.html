<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join me on TikTok Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose-900: #4a1d33;
      --rose-700: #b8326a;
      --rose-500: #ee5b8f;
      --rose-300: #f9a8c6;
      --rose-100: #ffe4ef;
      --rose-50:  #fff6fa;
      --lilac:    #e9dcff;
      --muted:    #a7798f;
      --green-700: #1f7a4d;
      --green-500: #2e9e64;
      --green-100: #e2f8ec;
      --green-300: #b6eccd;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--rose-900);
      background:
        radial-gradient(circle at 15% 10%, #ffd6e7 0, transparent 45%),
        radial-gradient(circle at 90% 85%, var(--lilac) 0, transparent 50%),
        linear-gradient(165deg, #fff1f6, #fde7f0 50%, #f5edff);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- floating decorations ---------- */
    .float-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .float-layer svg {
      position: absolute; bottom: -60px;
      animation: drift 14s linear infinite;
      opacity: 0;
    }
    .float-layer svg:nth-child(1) { left: 6%;  width: 26px; animation-delay: 0s; }
    .float-layer svg:nth-child(2) { left: 24%; width: 16px; animation-delay: 3s; }
    .float-layer svg:nth-child(3) { left: 46%; width: 30px; animation-delay: 7s; }
    .float-layer svg:nth-child(4) { left: 68%; width: 18px; animation-delay: 1.5s; }
    .float-layer svg:nth-child(5) { left: 84%; width: 24px; animation-delay: 5s; }
    .float-layer svg:nth-child(6) { left: 94%; width: 14px; animation-delay: 9s; }
    @keyframes drift {
      0%   { transform: translateY(0) rotate(-10deg); opacity: 0; }
      12%  { opacity: .55; }
      85%  { opacity: .55; }
      100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; }
    }

    /* ---------- card ---------- */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 384px;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 34px;
      padding: 30px 24px 24px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.9) inset,
        0 24px 60px -20px rgba(184,50,106,.35),
        0 4px 14px rgba(238,91,143,.08);
      text-align: center;
    }
    .card-bow {
      position: absolute; top: -26px; left: 50%;
      transform: translateX(-50%);
      width: 72px;
      filter: drop-shadow(0 6px 10px rgba(184,50,106,.25));
    }

    /* ---------- avatar + bubble ---------- */
    .who {
      display: flex; align-items: center; gap: 10px;
      margin: 12px 0 12px 2px;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(140deg, var(--rose-300), var(--rose-500));
      display: grid; place-items: center;
      box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--rose-100);
      position: relative;
    }
    .avatar svg { width: 20px; }
    .avatar::after {
      content: ''; position: absolute; right: -1px; bottom: -1px;
      width: 11px; height: 11px; border-radius: 50%;
      background: #3ccf73; border: 2px solid #fff;
    }
    .who-text { text-align: left; line-height: 1.2; }
    .who-text b { font-size: .9rem; font-weight: 800; }
    .who-text small { display: block; font-size: .7rem; color: var(--muted); font-weight: 700; }

    .bubble {
      background: linear-gradient(180deg, #fff, var(--rose-50));
      border: 1px solid var(--rose-100);
      border-radius: 6px 22px 22px 22px;
      padding: 16px 18px;
      text-align: left;
      font-size: .98rem;
      line-height: 1.6;
      font-weight: 500;
      box-shadow: 0 6px 18px -8px rgba(238,91,143,.3);
    }
    .bubble strong { font-weight: 800; color: var(--rose-700); }
    .bubble .script {
      font-family: 'Fraunces', serif; font-style: italic; font-weight: 600;
      color: var(--rose-500); font-size: 1.08em;
    }
    .bubble .hey { display: inline-flex; align-items: center; gap: 4px; }
    .bubble .hey svg { width: 15px; vertical-align: -2px; }

    /* ---------- CTA ---------- */
    .cta-label {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 24px 0 10px;
      font-size: .72rem; font-weight: 800; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--rose-500);
    }
    .cta-label svg { width: 12px; animation: twinkle 2s ease-in-out infinite; }
    .cta-label svg:last-child { animation-delay: 1s; }
    @keyframes twinkle { 0%,100% { transform: scale(.7) rotate(0); opacity: .5; } 50% { transform: scale(1.15) rotate(20deg); opacity: 1; } }

    .cta {
      display: flex; align-items: center; gap: 14px;
      width: 100%;
      padding: 12px 18px 12px 12px;
      border-radius: 999px;
      text-decoration: none;
      background: linear-gradient(135deg, #ff7aa6, var(--rose-500) 55%, #d93f7c);
      color: #fff;
      box-shadow:
        0 1px 0 rgba(255,255,255,.45) inset,
        0 -3px 0 rgba(0,0,0,.08) inset,
        0 14px 28px -10px rgba(217,63,124,.7);
      transition: transform .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative; overflow: hidden;
    }
    .cta::before {
      content: ''; position: absolute; top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
      transform: skewX(-20deg);
      animation: shine 3.2s ease-in-out infinite;
    }
    @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
    .cta:hover  { transform: translateY(-2px); }
    .cta:active { transform: translateY(1px) scale(.99); }

    .cta-icon {
      flex: none; width: 46px; height: 46px; border-radius: 50%;
      background: #fff; display: grid; place-items: center;
      box-shadow: 0 4px 10px rgba(184,50,106,.25);
    }
    .cta-icon svg { width: 24px; }
    .cta-text { flex: 1; text-align: left; line-height: 1.15; }
    .cta-text b { display: block; font-size: 1.1rem; font-weight: 800; letter-spacing: -.2px; }
    .cta-text small { font-size: .72rem; font-weight: 700; opacity: .88; }
    .cta-arrow { width: 20px; flex: none; transition: transform .2s ease; }
    .cta:hover .cta-arrow { transform: translateX(3px); }

    /* ---------- steps ---------- */
    .steps {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin: 22px 0 18px;
      list-style: none;
    }
    .steps li {
      background: var(--rose-50);
      border: 1px solid var(--rose-100);
      border-radius: 18px;
      padding: 12px 6px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .steps .ico {
      width: 32px; height: 32px; border-radius: 11px;
      background: #fff; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(238,91,143,.15);
    }
    .steps .ico svg { width: 17px; }
    .steps span { font-size: .7rem; font-weight: 800; color: var(--rose-900); line-height: 1.25; }
    .steps em { font-style: normal; font-size: .6rem; color: var(--muted); font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }

    /* ---------- verified green link badge ---------- */
    .verified {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--green-100);
      border: 1px solid var(--green-300);
      color: var(--green-700);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .3px;
      padding: 7px 16px 7px 12px;
      border-radius: 999px;
      margin: 0 auto 14px;
      box-shadow: 0 4px 12px -6px rgba(46,158,100,.45);
      text-decoration: none;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .verified:hover {
      background: #d3f4e2;
      box-shadow: 0 6px 16px -6px rgba(46,158,100,.6);
    }
    .verified:active { transform: scale(.97); }
    .verified .check {
      flex: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--green-500);
      display: grid; place-items: center;
      box-shadow: 0 0 0 2px rgba(46,158,100,.18);
    }
    .verified .check svg {
      width: 11px; height: 11px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- reusable shapes -->

      <symbol id="heart" viewBox="0 0 24 24">

  </svg>

  <div class="float-layer" aria-hidden="true">
    <svg viewBox="0 0 24 24"><use href="#heart"/></svg>
    <svg viewBox="0 0 24 24"><use href="#sparkle"/></svg>

    <svg viewBox="0 0 24 24"><use href="#heart"/></svg>
    <svg viewBox="0 0 24 24"><use href="#sparkle"/></svg>
    <svg viewBox="0 0 24 24"><use href="#heart"/></svg>
  </div>

  <main class="card">

      </div>
      <div class="who-text">
        <b>me</b>
        <small>online now</small>

    </div>

    <div class="bubble">
      <span class="hey"><span class="script">hey you</span> <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sparkle"/></svg></span>
      download <strong>TikTok Pro</strong> with my link below, then
      <span class="script">message me</span> so we can both earn rewards
    </div>

    <div class="cta-label">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sparkle"/></svg>
      tap here
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sparkle"/></svg>

    <a class="cta"

      <span class="cta-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18V6.5l10-2.5v11.5" stroke="url(#pink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="6.5" cy="18" r="3" fill="url(#pink)"/>
          <circle cx="16.5" cy="15.5" r="3" fill="url(#pink)"/>

      </span>
      <span class="cta-text">
        <b>Get TikTok Pro</b>
        <small>my referral link</small>
      </span>
      <svg class="cta-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h13m-5-6 6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </a>

    <ol class="steps">
      <li>
        <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14" stroke="#e84a86" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
        <em>step 1</em><span>tap &amp; download</span>
      </li>
      <li>
        <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" stroke="#e84a86" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span>

      <li>
        <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" stroke="#e84a86" stroke-width="2.2" stroke-linejoin="round" fill="none"/><circle cx="9" cy="10.5" r="1.2" fill="#e84a86"/><circle cx="12" cy="10.5" r="1.2" fill="#e84a86"/><circle cx="15" cy="10.5" r="1.2" fill="#e84a86"/></svg></span>

    <!-- verified green link badge -->
    <a class="verified"
       href="https://pro.tiktok.com/t/ZT9PPct1G2PJF-Q1bB3/"

  </main>

</body>
</html>
